<footer class="site-footer">

  <div class="wrap">

<!--    <div class="footer-col-1 column">
      <ul>
        <li>{{ site.title }}</li>
     </ul>
    </div>
-->
    <div class="footer-col-1 column">
       {% if site.github_username %}
          <a href="https://github.com/{{ site.github_username }}">
		<img src="/assets/simple-icons/icons/github/github-32-black.png" />
         </a>
        {% endif %}
        {% if site.twitter_username %}
          <a href="https://twitter.com/{{ site.twitter_username }}">
		<img src="/assets/simple-icons/icons/twitter/twitter-32-black.png" />
 
         </a>
        {% endif %}


        {% if site.linkedin_username %}
          <a href="https://linkedin.com/in/{{ site.linkedin_username }}">
		<img src="/assets/simple-icons/icons/linkedin/linkedin-32-black.png" />
 
	  </a>
        {% endif %}

        {% if site.email %}
          <a href="mailto:{{ site.email }}">
		<img src="/assets/simple-icons/icons/gmail/gmail-32-black.png" />
 
	  </a>
        {% endif %}



      </ul>
    </div>

	<div class="footer-col-2 column">

	</div>

    <div class="footer-col-3 column">
      <p style="text-align:right" class="text">{{ site.description }}</p>
    </div>




  </div>

</footer>
